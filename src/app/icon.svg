<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2D78"/>
      <stop offset="100%" stop-color="#FFD700"/>
    </linearGradient>
  </defs>

  <!-- Dark background -->
  <rect width="64" height="64" rx="14" fill="#0B0A0F"/>

  <!-- Soft glow fill -->
  <rect x="4" y="4" width="56" height="56" rx="12" fill="url(#g)" opacity="0.22"/>

  <!-- Border -->
  <rect
    x="3.5"
    y="3.5"
    width="57"
    height="57"
    rx="12.5"
    fill="none"
    stroke="url(#g)"
    stroke-width="2.5"
  />

  <!-- SN text -->
  <text
    x="50%"
    y="54%"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="24"
    font-weight="800"
    fill="url(#g)"
  >
    SN
  </text>
</svg>